  <script>
    // Coordination with Flutter loader to ensure service workers are handled correctly
    // Removing aggressive unregistration that caused conflicts and timeouts.

    // Platform detection
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    const isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);
    const isMacOS = /Macintosh/.test(navigator.userAgent) && !isIOS;
    const isApplePlatform = isIOS || isMacOS;



    if (isApplePlatform) {
      console.log("Notifications disabled for Apple platforms (iOS/macOS)");
    }

    // Resource error logging to debug 403 errors
    window.addEventListener('error', function (e) {
      if (e.target && (e.target.src || e.target.href)) {
        const src = e.target.src || e.target.href;
        // Ignore tracking/analytics resources blocked by adblockers/privacy settings
        if (src.includes('googletagmanager.com') || src.includes('connect.facebook.net') || src.includes('clarity.ms') || src.includes('google-analytics.com')) {
          console.warn('Analytics/Tracking resource blocked by browser/ad-blocker (this is expected and harmless):', src);
          return;
        }
        console.error('Resource load failed:', src);
      } else {
        console.error('Global Error:', e.error || e.message);
      }
    }, true);

    window.addEventListener('unhandledrejection', function (event) {
      console.error('Unhandled Promise Rejection:', event.reason);
    });
  </script>

  <script>
    // Your web app's Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyCo6aiDqr34bAQzMbSdV91W0-p_n6UDiIo",

      databaseURL: "https://furniquoteapp-dev-default-rtdb.firebaseio.com",
      projectId: "furniquoteapp-dev",

      messagingSenderId: "756530430220",
      appId: "1:756530430220:web:09366dc8560b92fb870929",
      measurementId: "G-0FPQ5DFF66"
    };

    // Initialize Firebase
    const app = firebase.initializeApp(firebaseConfig);

    // Initialize Firebase Analytics
    const analytics = firebase.analytics();

    // Initialize Firebase Messaging
    const messaging = firebase.messaging();

    // Configure Firebase Remote Config
    const remoteConfig = firebase.remoteConfig();
    remoteConfig.settings = {
      minimumFetchIntervalMillis: 3600000, // 1 hour
    };

    // Request notification permission (safely defined but inactive to prevent errors if called)
    window.requestNotificationPermission = function () {
      console.log('Notification request skipped (handled by Flutter or disabled)');
      return Promise.resolve(null);
    };

    // Handle incoming messages
    messaging.onMessage((payload) => {
      console.log('Message received. ', payload);
      // Handle the received message
      const notificationTitle = payload.notification?.title || 'New Notification';
      const notificationOptions = {
        body: payload.notification?.body || '',
        icon: payload.notification?.icon || 'icons/Icon-192.png'
      };

      if (!isApplePlatform && window.Notification && window.Notification.permission === 'granted') {
        new window.Notification(notificationTitle, notificationOptions);
      }
    });

    // Initialize service worker (Disabled for iOS/Safari to avoid Notification API issues)
    if ('serviceWorker' in navigator && !isIOS && !isSafari) {
      window.addEventListener('load', () => {
        // Use relative path to ensure it works with base-href
        navigator.serviceWorker.register('firebase-messaging-sw.js')
          .then(registration => {
            console.log('Service Worker registered with scope: ', registration.scope);
          })
          .catch(err => {
            console.log('Service Worker registration failed: ', err);
          });
      });
    }

    // Set default values for Remote Config
    remoteConfig.defaultConfig = {
      // Add your default config values here
    };

    // Fetch and activate Remote Config
    remoteConfig.fetchAndActivate()
      .then(() => {
        console.log('Remote Config initialized');
      })
      .catch(err => {
        console.error('Error initializing Remote Config', err);
      });
  </script>
